    state.fontSize = parseFloat(e.target.value);
    document.getElementById("zoomVal").textContent = Math.round(state.fontSize) + "px";
    // buildColumns() already replaces every column with a fresh one, but
    // burst/flood drops live in a separate array it doesn't touch — left
    // alone, those keep falling at the old font size until they exit on
    // their own, which is the "takes a long time to clear" lag.
    state.floodFalls = [];
    floodQueue = [];
    buildColumns();
  });

  document.getElementById("density").addEventListener("input", function (e) {
    state.densityPct = parseFloat(e.target.value);
    document.getElementById("densityVal").textContent = Math.round(state.densityPct) + "%";
    // No rebuild needed — density no longer affects the column grid, only
    // each column's own respawn timing (see step()), which just picks up
    // the new value the next time each column naturally exhausts.
  });

  document.getElementById("burst").addEventListener("input", function (e) {
    state.burstPct = parseFloat(e.target.value);
    document.getElementById("burstVal").textContent = state.burstPct <= 0 ? "Off" : Math.round(state.burstPct) + "%";
    state.nextFloodDelay = pickNextFloodDelay();
  });

  document.getElementById("trailLen").addEventListener("input", function (e) {
    state.trailLenMul = parseFloat(e.target.value) / 100;
    document.getElementById("trailLenVal").textContent = Math.round(e.target.value) + "%";
  });

  document.getElementById("residualsToggle").addEventListener("click", function () {
    state.residualsEnabled = !state.residualsEnabled;
    this.setAttribute("aria-pressed", String(state.residualsEnabled));
    this.textContent = state.residualsEnabled ? "On" : "Off";
  });

  // Slider's max is set here rather than hardcoded in the markup, so it
  // always matches MESSAGE_WORDS.length (+1 for the cat's own slot in
  // the same pool, see trySpawnAllMessages) even if the word list grows
  // or shrinks later. Default value (28, i.e. max — all 27 words plus
  // the cat) is left as a fixed number rather than auto-tracking that
  // max formula, so it won't silently drift if the word list changes.
  var residualsCountEl = document.getElementById("residualsCount");
  var residualsCountDefault = 27;
  residualsCountEl.max = MESSAGE_WORDS.length + 1;
  residualsCountEl.value = residualsCountDefault;
  state.residualsCount = residualsCountDefault;
  document.getElementById("residualsCountVal").textContent = residualsCountDefault;
  residualsCountEl.addEventListener("input", function (e) {
    state.residualsCount = parseInt(e.target.value, 10);
    document.getElementById("residualsCountVal").textContent = state.residualsCount;
  });

  document.getElementById("dejaVuToggle").addEventListener("click", function () {
    state.dejaVuEnabled = !state.dejaVuEnabled;
    this.setAttribute("aria-pressed", String(state.dejaVuEnabled));
    this.textContent = state.dejaVuEnabled ? "On" : "Off";
  });

  var swatches = document.querySelectorAll(".swatch");
  swatches.forEach(function (btn) {
    btn.addEventListener("click", function () {
      swatches.forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
      btn.setAttribute("aria-pressed", "true");
      state.theme = btn.getAttribute("data-theme");
      setRootVars(state.theme);
    });
  });

  // Scoped to [data-charset] specifically — the Residuals toggle reuses
  // the same .charset-toggle class purely for shared styling, but isn't
  // one of the character-set buttons this loop wires up. Without this
  // scoping it matched that button too, and since it has no data-charset
  // attribute the handler's "next enabled state" always evaluated true,
  // forcing aria-pressed back to "true" right after Residuals' own click
  // handler had just set it to "false".
  var charsetToggles = document.querySelectorAll(".charset-toggle[data-charset]");
  charsetToggles.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var key = btn.getAttribute("data-charset");
      var next = !state.charSets[key];
      // Block turning off the last remaining set from the UI — leaves
      // activeChars()'s empty-pool fallback purely as a defensive backstop,
      // not a state the toggles can actually walk the user into.
      if (!next) {
        var others = Object.keys(state.charSets).some(function (k) {
          return k !== key && state.charSets[k];
        });
        if (!others) return;
      }
      state.charSets[key] = next;
      btn.setAttribute("aria-pressed", String(next));
    });
  });

  document.getElementById("pauseBtn").addEventListener("click", function () {
    if (state.running) { pause(); } else { play(); }
  });

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" && e.target === document.body) {
      e.preventDefault();
      if (state.running) pause(); else play();
    }
  });

  document.body.addEventListener("pointermove", function () {
    document.body.classList.remove("dim");
    clearTimeout(window.__dimT);
    window.__dimT = setTimeout(function () {
      document.body.classList.add("dim");
    }, 4000);
  });
})();
</script>
